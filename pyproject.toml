[project]
name = "mlp"
version = "0.1.0"
description = "Multilayer perceptron from scratch (numpy)"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pandas>=2.3",
]

[dependency-groups]
dev = [
    "mypy",
    "flake8",
    "flake8-docstrings",
    "pytest",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlp"]

[tool.mypy]
strict = true
# 3.12 and not 3.10: the numpy stubs use `type` statements, which mypy
# refuses to parse when targeting an older version.
python_version = "3.12"
files = ["src", "tests", "split.py", "train.py", "predict.py", "explore.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets the tests import the programs of the root (split, train, ...).
pythonpath = ["."]
