[project]
name = "mlp"
version = "0.1.0"
description = "Multilayer perceptron from scratch (numpy)"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pandas>=2.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlp"]
